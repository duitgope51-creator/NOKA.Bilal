<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>NOKA — Virtual Number Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050b14;--card:#0c1625;--line:#1b3049;--blue:#1687ff;--blue2:#35b7ff;--text:#f4f8ff;--muted:#8495aa;--green:#24d47a;--red:#ff5266;--yellow:#ffc857}
body{font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top,#102a49 0,#07111f 35%,#050b14 100%);color:var(--text);min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:85px}
#loading{position:fixed;inset:0;z-index:9999;background:#040a12;display:flex;align-items:center;justify-content:center;flex-direction:column}
.logoBig{width:145px;height:145px;object-fit:contain;border-radius:25px;background:#fff;box-shadow:0 0 55px #1687ff55;animation:pulse 1.2s infinite alternate}
.loader{width:170px;height:4px;background:#152337;border-radius:20px;margin-top:30px;overflow:hidden}.loader i{display:block;width:45%;height:100%;background:linear-gradient(90deg,#1687ff,#54c5ff);animation:load 1.2s infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(350%)}}@keyframes pulse{to{transform:scale(1.05);box-shadow:0 0 75px #1687ff66}}
.fade{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.header{position:sticky;top:0;z-index:50;padding:16px;background:#07111fe8;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff08}.headrow{display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:1000;letter-spacing:.5px}.brand span{color:#269bff}
.balance{background:#0d1c2e;border:1px solid #1a3b5d;border-radius:14px;padding:9px 12px;font-size:12px;color:#a9bfd7}.balance b{display:block;color:#fff;font-size:14px;margin-top:2px}
.page{padding:18px 15px}.title{font-size:25px;font-weight:900;margin-bottom:5px}.subtitle{font-size:13px;color:var(--muted);margin-bottom:20px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;font-size:16px;font-weight:800}
.hero{padding:21px;border-radius:24px;background:linear-gradient(135deg,#0d65bd,#0b2c52 60%,#0b1727);border:1px solid #2c9bff33;box-shadow:0 18px 45px #0004}.hero small{color:#b9ddff}.hero h2{font-size:25px;margin:8px 0}.hero p{font-size:12px;color:#c1d7ec;line-height:1.6}
.serviceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.service{min-height:105px;padding:14px 8px;border-radius:18px;background:linear-gradient(145deg,#0d1a2b,#091320);border:1px solid var(--line);color:#fff;transition:.2s}.service:active{transform:scale(.96)}.service .ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:auto auto 9px;font-size:20px;background:#102b47}.service b{font-size:12px;display:block}.service small{font-size:9px;color:var(--muted)}
.card{background:linear-gradient(145deg,#0d1929,#091321);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:11px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.appLogo{width:48px;height:48px;border-radius:14px;object-fit:cover;background:#fff;padding:7px;flex:none}.appInfo{flex:1;min-width:0}.appInfo b{font-size:14px}.appInfo small{display:block;color:var(--muted);margin-top:4px}.price{color:#fff;font-weight:900;font-size:14px;white-space:nowrap}.stock{font-size:10px;color:#5ee89e;margin-top:4px}.buy{margin-top:12px;width:100%;padding:12px;border-radius:13px;background:linear-gradient(90deg,#0879ed,#20a8ff);color:white;font-weight:900}.catGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cat{min-height:135px;padding:17px;border-radius:22px;background:linear-gradient(145deg,#0d1d31,#08121f);border:1px solid #1b3855;position:relative;overflow:hidden;color:#fff;text-align:left}.cat:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-25px;bottom:-30px;background:#1687ff18}.cat .catIcon{font-size:28px;margin-bottom:20px}.cat b{font-size:15px}.cat small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#07111ff5;backdrop-filter:blur(20px);border-top:1px solid #ffffff0d;z-index:80}.nav{background:none;color:#687e96;padding:6px;font-size:10px}.nav.active{color:#35aaff}.nav span{display:block;font-size:20px;margin-bottom:3px}
input{width:100%;padding:14px;background:#071321;border:1px solid #1d354e;border-radius:13px;color:#fff;outline:none}input:focus{border-color:#1687ff}.formGroup{margin-bottom:13px}.formGroup label{font-size:11px;color:#91a7be;display:block;margin-bottom:6px}.primary,.secondary{width:100%;padding:14px;border-radius:13px;font-weight:900}.primary{color:#fff;background:linear-gradient(90deg,#0879ed,#1ca9ff)}.secondary{padding:13px;background:#102238;color:#b8d2ea;border:1px solid #1d3a57}.danger{background:#3a121b!important;color:#ff7180!important}.success{color:var(--green)}.warning{color:var(--yellow)}.muted{color:var(--muted)}
.nominalGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nominal{padding:16px;border-radius:15px;background:#0d1d30;border:1px solid #1b3957;color:#fff;text-align:left}.nominal b{display:block;font-size:16px}.nominal small{color:#7890a8}.walletGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.walletBtn{padding:15px;border-radius:17px;background:#0d1d30;border:1px solid #1b3957;color:#fff;text-align:left}.walletBtn b{display:block;font-size:13px}.walletBtn small{display:block;color:#7890a8;margin-top:4px;font-size:10px}
.tx{padding:14px;border-radius:17px;background:#0b1726;border:1px solid #193149;margin-bottom:10px}.badge{font-size:9px;padding:5px 8px;border-radius:99px;background:#18334c;color:#9fc7e9}.badge.waiting{background:#3b3011;color:#ffd45f}.badge.success{background:#103a29;color:#54e49b}.badge.refunded{background:#12344a;color:#6fc8ff}.badge.expired{background:#331821;color:#ff7180}
.modal{position:fixed;inset:0;background:#0009;z-index:200;display:flex;align-items:flex-end}.sheet{width:min(520px,100%);margin:auto;max-height:90vh;overflow:auto;background:#091523;border:1px solid #1e3852;border-radius:25px 25px 0 0;padding:19px}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{width:35px;height:35px;border-radius:50%;background:#14273b;color:#b7d0e7}
#toast{position:fixed;z-index:9999;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#13273d;color:#fff;border:1px solid #285273;padding:11px 16px;border-radius:13px;font-size:12px;opacity:0;pointer-events:none;transition:.25s}#toast.show{opacity:1;transform:translateX(-50%)}
.adminItem{padding:13px;background:#0b1929;border:1px solid #19344d;border-radius:14px;margin-bottom:8px}
.chatBox{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow:auto;padding:6px}.msg{max-width:86%;padding:11px 13px;border-radius:15px;font-size:12px;line-height:1.45}.aiMsg{align-self:flex-start;background:#0d1d30;border:1px solid #1b3957}.userMsg{align-self:flex-end;background:#07558a}.chatQR{width:220px;height:220px;object-fit:contain;background:#fff;border-radius:14px;display:block;margin-top:10px}.proofPreview{max-width:230px;max-height:260px;border-radius:12px;margin-top:7px;display:block}.chatComposer{display:flex;gap:8px;align-items:center;margin-top:10px}.chatComposer input[type=file]{display:none}.attachBtn{width:46px;height:46px;border-radius:13px;border:1px solid #1b3957;background:#0d1d30;color:#fff;font-size:20px}.chatSend{flex:1}</style>
</head>

let db=loadDB(),timerInterval=null;
function loadDB(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x){let d=Object.assign(JSON.parse(JSON.stringify(defaultDB)),x);if(!Array.isArray(d.users))d.users=[];if(!d.nextUserId)d.nextUserId=d.users.length+1;return d}}catch(e){}return JSON.parse(JSON.stringify(defaultDB))}
function saveDB(){const u=db.users.find(x=>x.id===db.currentUserId);if(u)u.balance=Number(db.balance||0);localStorage.setItem(KEY,JSON.stringify(db));updateBalance()}
function rupiah(n){return"Rp"+Number(n||0).toLocaleString("id-ID")}
function updateBalance(){const b=document.getElementById('balanceText');if(b)b.textContent=rupiah(db.balance);const i=document.getElementById('userIdText');if(i)i.textContent=db.currentUserId||'ID—'}
function toast(m){let t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function img(k){return icons[k]||"https://cdn.simpleicons.org/google"}
function go(p){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));let n=document.getElementById("nav-"+p);if(n)n.classList.add("active");if(p==="home")renderHome();if(p==="virtual")renderCategories();if(p==="history")renderHistory()}
function emailValid(v){return /^[^\s@]+@gmail\.com$/i.test(v)}
function getCurrentUser(){return db.users.find(u=>u.id===db.currentUserId)||null}
function openLogin(){const u=getCurrentUser();modalRoot.innerHTML=`<div class="modal" style="align-items:center"><div class="sheet fade" style="border-radius:25px;max-height:none"><div style="text-align:center;margin-bottom:20px"><div style="font-size:42px">✉️</div><h2>Masuk ke NOKA</h2><p class="muted" style="font-size:12px;margin-top:6px">Gunakan Gmail untuk membuat ID pengguna unik.</p></div><div class="formGroup"><label>NAMA</label><input id="loginName" placeholder="Nama kamu" value="${u?u.name:''}"></div><div class="formGroup"><label>GMAIL</label><div style="display:flex;gap:8px"><input id="loginGmail" placeholder="nama@gmail.com" value="${u?u.email:''}" style="flex:1"><button class="primary" style="width:auto;white-space:nowrap;padding:14px 12px" onclick="sendGmailCode()">Kirim Kode</button></div></div><div class="formGroup"><label>KODE VERIFIKASI</label><input id="loginCode" inputmode="numeric" maxlength="6" placeholder="6 digit kode"></div><div id="demoCodeBox" class="card" style="display:none;border-color:#315a7d"><small class="muted">Mode HTML demo</small><b id="demoCode" style="display:block;font-size:24px;letter-spacing:5px;margin-top:5px"></b><small class="muted" style="display:block;margin-top:5px">Kode ini belum benar-benar dikirim lewat Gmail. Pengiriman email nyata membutuhkan backend/email service.</small></div><button class="primary" onclick="verifyLogin()">Verifikasi & Masuk</button></div></div>`}
function sendGmailCode(){const name=(document.getElementById('loginName').value||'').trim();const email=(document.getElementById('loginGmail').value||'').trim().toLowerCase();if(!name)return toast('Masukkan nama');if(!emailValid(email))return toast('Gunakan alamat @gmail.com');let u=db.users.find(x=>x.email===email);if(!u){u={id:'ID '+db.nextUserId++,name,email,balance:0,created:Date.now()};db.users.push(u)}else{u.name=name}u.pendingCode=String(Math.floor(100000+Math.random()*900000));u.codeExpires=Date.now()+5*60*1000;saveDB();document.getElementById('demoCodeBox').style.display='block';document.getElementById('demoCode').textContent=u.pendingCode;toast('Kode verifikasi dibuat untuk '+email)}
function verifyLogin(){const name=(document.getElementById('loginName').value||'').trim();const email=(document.getElementById('loginGmail').value||'').trim().toLowerCase();const code=(document.getElementById('loginCode').value||'').trim();const u=db.users.find(x=>x.email===email);if(!u||!u.pendingCode)return toast('Klik Kirim Kode terlebih dahulu');if(Date.now()>u.codeExpires)return toast('Kode sudah kedaluwarsa');if(code!==u.pendingCode)return toast('Kode verifikasi salah');u.name=name;u.pendingCode='';u.codeExpires=0;db.currentUserId=u.id;db.balance=Number(u.balance||0);saveDB();closeModal();renderHome();toast('Berhasil masuk sebagai '+u.name+' • '+u.id)}
function switchUser(){openLogin()}

function showQrisPayment(a){
 const expires=Date.now()+30*60*1000;
 const txId='TOP'+Date.now();
 db.history.unshift({id:txId,type:'topup',amount:a,status:'waiting',created:Date.now(),expires,proof:null,verification:'waiting'});
 saveDB();
 modalRoot.innerHTML=`<div class="modal"><div class="sheet fade"><div class="sheetHead"><b>Chat Pembayaran NOKA</b><button class="close" onclick="closeModal()">×</button></div><div class="card" style="padding:8px"><div id="payChat" class="chatBox">
 <div class="msg aiMsg"><b>NOKA AI</b><br>Silakan bayar sesuai nominal <b>${rupiah(a)}</b>. Scan QRIS di bawah. Jangan mengubah nominal pembayaran.<img class="chatQR" src="${db.qris}" onerror="this.style.display='none'"><small style="display:block;color:var(--muted);margin-top:8px">Setelah pembayaran, kirim <b>foto bukti pembayaran</b> di chat ini. Tim/sistem akan melakukan pemeriksaan sebelum saldo diproses.</small></div>
 <div class="msg aiMsg"><b>Sisa waktu:</b> <span id="qrisTimer">30:00</span><br><span style="color:var(--muted)">QRIS tujuan tetap QRIS NOKA yang tersimpan.</span></div>
 </div></div><div class="chatComposer"><label class="attachBtn" for="proofFile" title="Kirim foto">＋</label><input id="proofFile" type="file" accept="image/*" onchange="handleProofUpload('${txId}',this)"><button class="primary chatSend" onclick="downloadQris()">⬇ Unduh QRIS</button></div><small class="muted" style="display:block;text-align:center;margin-top:8px">Kirim foto bukti pembayaran melalui tombol ＋. Tidak ada tombol “Saya Sudah Bayar”.</small></div></div>`;
 startQrisTimer(txId)
}
function handleProofUpload(id,input){
 const file=input.files&&input.files[0]; if(!file)return;
 if(!file.type.startsWith('image/')){toast('Kirim file foto bukti pembayaran');return}
 if(file.size>8*1024*1024){toast('Ukuran foto maksimal 8 MB');return}
 const reader=new FileReader();
 reader.onload=()=>{
  const tx=db.history.find(x=>x.id===id&&x.type==='topup'); if(!tx||tx.status!=='waiting')return toast('Pesanan sudah tidak aktif');
  tx.proof=reader.result; tx.proofName=file.name; tx.proofSize=file.size; tx.proofAt=Date.now(); tx.verification='pending';
  const chat=document.getElementById('payChat');
  if(chat){const user=document.createElement('div');user.className='msg userMsg';user.innerHTML='<b>Anda</b><br><img class="proofPreview" src="'+reader.result+'"><small>Foto bukti pembayaran dikirim.</small>';chat.appendChild(user);const ai=document.createElement('div');ai.className='msg aiMsg';ai.innerHTML='<b>NOKA AI</b><br>Foto bukti diterima. Saya melakukan pemeriksaan awal terhadap file. <b>Status: menunggu verifikasi pembayaran.</b><br><small style="color:var(--muted)">Pemeriksaan foto saja tidak dapat membuktikan bahwa transaksi benar-benar terjadi. Saldo tidak akan ditambahkan hanya berdasarkan foto.</small>';chat.appendChild(ai);chat.scrollTop=chat.scrollHeight}
  saveDB(); toast('Bukti pembayaran diterima dan masuk proses verifikasi');
 }; reader.readAsDataURL(file); input.value='';
}
function startQrisTimer(txId){clearInterval(timerInterval);timerInterval=setInterval(()=>{const tx=db.history.find(x=>x.id===txId);const el=document.getElementById('qrisTimer');if(!tx||!el){clearInterval(timerInterval);return}const left=Math.max(0,tx.expires-Date.now());const m=String(Math.floor(left/60000)).padStart(2,'0');const s=String(Math.floor((left%60000)/1000)).padStart(2,'0');el.textContent=m+':'+s;if(left<=0){clearInterval(timerInterval);if(tx.status==='waiting'){tx.status='expired';saveDB();el.textContent='WAKTU HABIS';toast('Waktu pembayaran habis')}}},250)}
function markTopupPaid(id){const tx=db.history.find(x=>x.id===id&&x.type==='topup');if(!tx)return;if(tx.status!=='waiting')return toast('Pesanan sudah selesai');toast('Pembayaran menunggu verifikasi. Hubungkan payment gateway/webhook untuk otomatis masuk.');}
function downloadQris(){const src=db.qris;if(!src)return toast('QRIS belum tersedia');const a=document.createElement('a');a.href=src;a.download='NOKA-QRIS.png';document.body.appendChild(a);a.click();a.remove();toast('QRIS disimpan ke perangkat')}

function exportChatUpDB(){
  const numbers=db.history.filter(tx=>tx.type==='virtual'&&tx.status==='success'&&tx.number&&tx.otp).map(tx=>({
    number:tx.number,otp:String(tx.otp),country:tx.country||'Indonesia',app:tx.app||'NOKA Virtual Number',created:tx.created
  }));
  const payload={source:'NOKA Gmail ID',version:1,exportedAt:new Date().toISOString(),numbers};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='noka-gmail-id-chat-up.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(numbers.length?'Database untuk Chat Up berhasil diekspor':'Belum ada nomor NOKA yang sudah menerima OTP');
}
function demoNumber(p){
  // Indonesia: SELALU +62 8xxxxxxxxxx (tidak pernah +62 2 / +62 5).
  if(!p.country || p.country==="Indonesia"){
    const prefixes=["811","812","813","821","822","823","851","852","853","855","856","857","858","859","877","878","879","881","882","883","885","886","887","888","889","895","896","897","898","899"];
    const prefix=prefixes[Math.floor(Math.random()*prefixes.length)];
    const tail=String(Math.floor(Math.random()*10000000)).padStart(7,"0");
    return "+62 "+prefix+tail;
  }
  if(p.country==="Malaysia") return "+60 "+(10+Math.floor(Math.random()*90))+" "+String(Math.floor(Math.random()*10000000)).padStart(7,"0");
  if(p.country==="Brunei") return "+673 "+String(Math.floor(2000000+Math.random()*7000000));
  if(p.country==="Thailand") return "+66 "+(6+Math.floor(Math.random()*4))+String(Math.floor(Math.random()*100000000)).padStart(8,"0");
  if(p.country==="USA") return "+1 "+String(Math.floor(200+Math.random()*700))+" "+String(Math.floor(100+Math.random()*900))+" "+String(Math.floor(1000+Math.random()*9000));
  return "+62 8"+String(Math.floor(Math.random()*1000000000)).padStart(9,"0");
}
function statusText(s){return{waiting:"MENUNGGU OTP",success:"BERHASIL",refunded:"REFUNDED",expired:"EXPIRED"}[s]||s}
function openTransaction(id){let tx=db.history.find(x=>x.id===id);if(!tx)return;if(tx.status==="waiting"&&Date.now()>=tx.expires){tx.status="expired";saveDB()}modalRoot.innerHTML=`<div class="modal"><div class="sheet fade"><div class="sheetHead"><b>Detail Nomor</b><button class="close" onclick="closeModal()">×</button></div><div class="card"><div class="row between"><div><small class="muted">Aplikasi</small><b style="display:block;margin-top:4px">${tx.app}</b></div><span class="badge ${tx.status}">${statusText(tx.status)}</span></div></div><div class="card"><small class="muted">Nomor</small><div class="row" style="margin-top:7px"><b style="font-size:19px;flex:1">${tx.number}</b><button class="secondary" style="width:auto" onclick="copyText('${tx.number}')">Copy</button></div></div>${tx.status==="waiting"?`<div class="card" style="text-align:center"><small class="muted">Waktu menunggu OTP</small><h1 id="timer" style="margin:7px 0;color:#35b7ff">02:00</h1><small class="muted">Belum menerima OTP</small></div><button class="primary" onclick="requestDemoOTP('${tx.id}')">📩 Minta OTP</button><button class="secondary" style="margin-top:9px" onclick="refundTx('${tx.id}')">↩ Refund</button>`:""}${tx.status==="success"?`<div class="card"><small class="muted">OTP</small><div class="row" style="margin-top:7px"><b style="font-size:24px;letter-spacing:4px;flex:1">${tx.otp}</b><button class="secondary" style="width:auto" onclick="copyText('${tx.otp}')">Copy</button></div></div>`:""}${tx.status==="refunded"?`<div class="card"><b class="success">Dana telah dikembalikan ke saldo.</b></div>`:""}${tx.status==="expired"?`<div class="card"><b class="warning">Waktu OTP telah habis.</b><small class="muted" style="display:block;margin-top:6px">Transaksi sudah expired dan tidak dapat direfund.</small></div>`:""}</div></div>`;if(tx.status==="waiting")startTimer(tx.id)}
function startTimer(id){clearInterval(timerInterval);function tick(){let tx=db.history.find(x=>x.id===id),el=document.getElementById("timer");if(!tx)return clearInterval(timerInterval);let r=Math.max(0,tx.expires-Date.now());if(el){let s=Math.ceil(r/1000);el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}if(r<=0&&tx.status==="waiting"){tx.status="expired";saveDB();clearInterval(timerInterval);openTransaction(id)}}tick();timerInterval=setInterval(tick,500)}
function requestDemoOTP(id){let tx=db.history.find(x=>x.id===id);if(!tx||tx.status!=="waiting")return;toast("Permintaan OTP dikirim...");setTimeout(()=>{let t=db.history.find(x=>x.id===id);if(!t||t.status!=="waiting"||Date.now()>=t.expires)return;t.otp=String(Math.floor(100000+Math.random()*900000));t.status="success";saveDB();toast("OTP diterima");openTransaction(id)},4000)}
function refundTx(id){let tx=db.history.find(x=>x.id===id);if(!tx||tx.status!=="waiting")return toast("Refund tidak tersedia");if(Date.now()>=tx.expires){tx.status="expired";saveDB();return openTransaction(id)}if(!confirm("Kembalikan dana transaksi ini?"))return;tx.status="refunded";db.balance+=tx.price;saveDB();clearInterval(timerInterval);toast("Dana dikembalikan");openTransaction(id)}
function renderHistory(){content.innerHTML=`<section class="page fade"><div class="title">Riwayat</div><div class="subtitle">Semua transaksi akun kamu.</div>${db.history.length?db.history.map(tx=>`<button class="tx" style="width:100%;text-align:left;color:white" onclick="${tx.type==="virtual"?"openTransaction('"+tx.id+"')":"void(0)"}"><div class="row between"><div><b>${tx.app||tx.type}</b><small class="muted" style="display:block;margin-top:4px">${new Date(tx.created).toLocaleString("id-ID")}</small></div><span class="badge ${tx.status||""}">${tx.status?statusText(tx.status):"TRANSAKSI"}</span></div><div class="row between" style="margin-top:12px"><span class="muted">${tx.type==="wallet"?(tx.provider+" • "+tx.target):(tx.number||"")}</span><b>${rupiah(tx.price||tx.amount||0)}</b></div></button>`).join(""):`<div class="card" style="text-align:center;padding:35px"><div style="font-size:35px">📭</div><b>Belum ada transaksi</b><p class="muted" style="font-size:11px;margin-top:5px">Transaksi kamu akan muncul di sini.</p></div>`}</section>`}

function openAdmin(){const deviceId=getAdminDeviceId();modalRoot.innerHTML=`<div class="modal"><div class="sheet fade"><div class="sheetHead"><b>Admin NOKA</b><button class="close" onclick="closeModal()">×</button></div>${!db.adminLogged?`<div class="card"><div style="padding:10px 12px;background:#0b1929;border:1px solid #19344d;border-radius:12px;margin-bottom:12px"><small class="muted">ID ADMIN PERANGKAT INI</small><b style="display:block;margin-top:5px;font-size:18px">${deviceId}</b><small class="muted" style="display:block;margin-top:4px">Setiap HP/browser memiliki ID berbeda.</small></div><div class="formGroup"><label>NAMA ADMIN</label><input id="adminNameInput" value="${db.adminName||''}" placeholder="Contoh: Admin 1"></div><div class="formGroup"><label>KODE ADMIN DEMO</label><input id="adminCode" type="password" placeholder="Masukkan kode"></div><button class="primary" onclick="adminLogin()">Masuk</button></div>`:adminPanel()}</div></div>`}
function adminLogin(){if(adminCode.value!=="112233")return toast("Kode admin salah");const name=(adminNameInput.value||'').trim();if(!name)return toast('Masukkan nama admin');db.adminName=name;db.adminDeviceId=getAdminDeviceId();db.adminLogged=true;saveDB();openAdmin()}
function adminPanel(){const deviceId=getAdminDeviceId();const pending=db.history.filter(tx=>tx.type==='wallet'&&tx.manual&&tx.status==='waiting');return `<div class="card"><div style="padding:12px;background:#0b1929;border:1px solid #19344d;border-radius:12px;margin-bottom:12px"><div class="row between"><div><small class="muted">ADMIN</small><b style="display:block;margin-top:4px">${db.adminName||'Admin'}</b></div><div style="text-align:right"><small class="muted">ID PERANGKAT</small><b style="display:block;margin-top:4px">${deviceId}</b></div></div></div><div class="row between"><div><small class="muted">Pesanan Masuk</small><h2 style="margin-top:5px">${pending.length}</h2></div><span class="badge waiting">MENUNGGU DIPROSES</span></div><small class="muted" style="display:block;margin-top:8px">Pesanan top up user yang baru masuk tampil di bawah.</small></div><div class="card"><small class="muted">Saldo Admin</small><h2 style="margin-top:5px">${rupiah(db.adminBalance)}</h2></div><div class="sectionTitle">Tambah saldo admin</div><div class="card"><input id="adminAdd" type="number" placeholder="Nominal"><button class="primary" style="margin-top:10px" onclick="addAdminBalance()">Tambah</button></div><div class="sectionTitle">Nominal Isi Saldo</div><div class="card">${db.nominal.map((n,i)=>`<div class="adminItem row between"><b>${rupiah(n)}</b><button class="close" onclick="removeNominal(${i})">×</button></div>`).join("")}<div class="row"><input id="newNominal" type="number" placeholder="Nominal baru"><button class="primary" style="width:auto;white-space:nowrap" onclick="addNominal()">Tambah</button></div></div><div class="sectionTitle">QRIS</div><div class="card"><input id="qrisUrl" value="${db.qris}"><button class="primary" style="margin-top:10px" onclick="saveQRIS()">Simpan QRIS</button></div><div class="sectionTitle">Kirim Saldo ke User</div><div class="card"><input id="targetUserId" placeholder="ID user, contoh ID 1, atau ALL"><input id="userBalance" type="number" placeholder="Nominal" style="margin-top:9px"><button class="primary" style="margin-top:10px" onclick="addUserBalance()">Kirim Saldo</button><small class="muted" style="display:block;margin-top:8px">Masukkan <b>ID user</b> tertentu atau <b>ALL</b> untuk semua pengguna.</small></div><div class="sectionTitle">Daftar Pengguna</div><div class="card">${db.users.length?db.users.map(u=>`<div class="adminItem"><div class="row between"><div><b>${u.id}</b><small style="display:block;color:var(--muted);margin-top:4px">${u.name} • ${u.email}</small></div><b>${rupiah(u.balance)}</b></div></div>`).join(''):'<div class="muted">Belum ada pengguna.</div>'}</div><div class="sectionTitle"><span>Pesanan Masuk ke Admin</span><span class="badge waiting">${pending.length} baru</span></div><div class="card">${db.history.filter(tx=>tx.type==='wallet'&&tx.manual).length?db.history.filter(tx=>tx.type==='wallet'&&tx.manual).map(tx=>`<div class="adminItem"><div class="row between"><div><b>${tx.provider}</b><small style="display:block;color:var(--muted);margin-top:4px">${tx.target}</small></div><b>${rupiah(tx.amount)}</b></div><small style="display:block;color:var(--muted);margin-top:8px">${new Date(tx.created).toLocaleString('id-ID')} • ${statusText(tx.status)}</small>${tx.status==='waiting'?`<div class="row" style="margin-top:10px"><button class="primary" onclick="adminWalletDone('${tx.id}')">Tandai Berhasil</button><button class="secondary danger" onclick="adminWalletFail('${tx.id}')">Gagal & Refund</button></div>`:''}</div>`).join(''):'<div class="muted" style="text-align:center;padding:10px">Belum ada pesanan top up manual.</div>'}</div>
<button class="secondary danger" onclick="adminLogout()">Keluar Admin</button>`}
function addAdminBalance(){let n=Number(adminAdd.value);if(!n||n<=0)return toast("Nominal tidak valid");db.adminBalance+=n;saveDB();openAdmin()}
function addUserBalance(){let n=Number(userBalance.value);let target=(targetUserId.value||'').trim().toUpperCase();if(!n||n<=0)return toast('Nominal tidak valid');if(!target)return toast('Masukkan ID user atau ALL');if(target==='ALL'){if(!db.users.length)return toast('Belum ada pengguna');db.users.forEach(u=>u.balance=Number(u.balance||0)+n);if(db.currentUserId){const me=getCurrentUser();db.balance=Number(me.balance||0)}saveDB();openAdmin();return toast('Saldo '+rupiah(n)+' dikirim ke semua pengguna')}const u=db.users.find(x=>x.id.toUpperCase()===target);if(!u)return toast('ID user tidak ditemukan');u.balance=Number(u.balance||0)+n;if(u.id===db.currentUserId)db.balance=u.balance;saveDB();openAdmin();toast('Saldo '+rupiah(n)+' dikirim ke '+u.id)}
function addNominal(){let n=Number(newNominal.value);if(!n||n<5000||n>100000)return toast("Nominal harus Rp5.000–Rp100.000");if(!db.nominal.includes(n))db.nominal.push(n);db.nominal.sort((a,b)=>a-b);saveDB();openAdmin()}
function removeNominal(i){if(db.nominal.length<=1)return toast("Minimal satu nominal");db.nominal.splice(i,1);saveDB();openAdmin()}
function saveQRIS(){let v=qrisUrl.value.trim();if(!v)return toast("URL QRIS kosong");db.qris=v;saveDB();toast("QRIS disimpan")}
function adminWalletDone(id){const tx=db.history.find(x=>x.id===id&&x.type==='wallet');if(!tx)return;if(tx.status!=='waiting')return;const amount=Number(tx.amount||0);if(amount<=0)return toast('Nominal transaksi tidak valid');if(Number(db.adminBalance||0)<amount)return toast('Saldo admin tidak mencukupi');db.adminBalance-=amount;tx.status='success';tx.completed=Date.now();tx.adminBalanceDeducted=amount;saveDB();openAdmin();updateBalance();toast('Berhasil. Saldo admin otomatis berkurang '+rupiah(amount))}
function adminWalletFail(id){const tx=db.history.find(x=>x.id===id&&x.type==='wallet');if(!tx)return;if(tx.status!=='waiting')return;const amount=Number(tx.amount||0);tx.status='refunded';db.balance+=amount;tx.refundedAt=Date.now();tx.refundAmount=amount;saveDB();openAdmin();updateBalance();toast('Gagal. Saldo user otomatis dikembalikan '+rupiah(amount))}
function adminLogout(){db.adminLogged=false;saveDB();closeModal()}
function closeModal(){clearInterval(timerInterval);modalRoot.innerHTML=""}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast("Berhasil disalin")).catch(()=>toast("Gagal menyalin"))}
let logoClicks=0;document.querySelector(".brand").addEventListener("click",()=>{logoClicks++;if(logoClicks>=5){logoClicks=0;openAdmin()}setTimeout(()=>logoClicks=0,3000)});
setTimeout(()=>{loading.style.opacity="0";loading.style.transition=".4s";setTimeout(()=>{loading.remove();if(db.currentUserId&&getCurrentUser())renderHome();else openLogin()},400)},1400);
updateBalance();
</script>

<div id="nokaLogoutOverlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto">
<div style="padding:18px;font-size:22px;font-weight:600;border-bottom:1px solid #eee">Keluar akun</div>
<div style="padding:24px"><p>Keluar atau reset akun NOKA/Gmail pada perangkat ini.</p>
<button class="primary" style="width:100%;margin-top:10px" onclick="nokaLogout(false)">Keluar saja</button>
<button class="primary" style="width:100%;margin-top:10px;background:#d93025" onclick="nokaLogout(true)">Keluar &amp; reset semua data NOKA</button>
<button style="width:100%;border:0;background:none;padding:16px" onclick="document.getElementById('nokaLogoutOverlay').style.display='none'">Batal</button></div></div>
<script>
function nokaLogout(resetAll){try{if(resetAll){localStorage.clear()}else{Object.keys(localStorage).forEach(k=>{if(/NOKA|noka|gmail|account|session|user/i.test(k))localStorage.removeItem(k)})}sessionStorage.clear()}catch(e){}location.reload()}
function openNokaLogout(){document.getElementById('nokaLogoutOverlay').style.display='block'}
</script>
<button onclick="openNokaLogout()" style="position:fixed;right:18px;bottom:18px;z-index:9998;border:0;border-radius:50%;width:54px;height:54px;background:#d93025;color:#fff;font-size:22px">↪</button>
</body>
</html>
